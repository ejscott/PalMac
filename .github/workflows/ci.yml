name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Run tests
        run: swift test
      - name: Build release binaries
        run: swift build -c release
